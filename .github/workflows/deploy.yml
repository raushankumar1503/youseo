name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build static export
        env:
          # Inlined into the static bundle at build time by Next.js. Set as a
          # plain repository *variable* (not a secret) named WORKER_URL under
          # Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_WORKER_URL: ${{ vars.WORKER_URL }}
        run: npm run build

      # GitHub Pages (via the deploy-pages action) won't run Jekyll, but a
      # .nojekyll sentinel keeps the site safe and ensures the `_next/` folder
      # is served rather than ignored. Place it inside out/ so it ships.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4